<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>SQU Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">SQU <span>Social</span></a>
    <div class="top-actions">
      <button id="themeToggle" class="icon-btn" aria-label="تغيير الوضع">☾</button>
      <button id="googleLogin" class="login-btn">G تسجيل الدخول</button>
      <div id="userMenu" class="user-menu" hidden>
        <img id="userPhoto" alt="صورة الحساب" />
        <div><strong id="userName"></strong><small id="userEmail"></small></div>
        <button id="logoutButton" class="text-btn">خروج</button>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <section class="stories-section">
      <div class="section-title"><h2>القصص</h2><button id="addStoryBtn" class="text-btn">+ أضف قصة</button></div>
      <div id="storiesRow" class="stories-row"><p class="muted">سجّل الدخول لمشاهدة القصص.</p></div>
    </section>

    <section class="composer-card">
      <div class="composer-head">
        <img id="composerAvatar" class="avatar" alt="حسابك" />
        <button id="openPostComposer" class="composer-trigger">شارك صورة أو لحظة مع الجميع…</button>
      </div>
    </section>

    <section id="feed" class="feed"><div class="loading">جارٍ تحميل المنشورات…</div></section>
  </main>

  <nav class="bottom-nav" aria-label="التنقل">
    <button class="active" data-go="top">⌂<span>الرئيسية</span></button>
    <button id="bottomAddPost">＋<span>إضافة</span></button>
    <button id="profileBtn">◎<span>الحساب</span></button>
  </nav>

  <dialog id="postDialog">
    <form id="postForm" class="modal-card">
      <button type="button" class="close" data-close="postDialog">×</button>
      <h2>منشور جديد</h2>
      <label>الصورة
        <input id="postImage" type="file" accept="image/*" required />
      </label>
      <div id="postPreview" class="image-preview" hidden></div>
      <label>الوصف
        <textarea id="postCaption" maxlength="600" placeholder="اكتب وصفًا للمنشور…"></textarea>
      </label>
      <p class="hint">تُضغط الصورة تلقائيًا قبل حفظها في Firestore.</p>
      <button id="publishPost" class="primary" type="submit">نشر</button>
    </form>
  </dialog>

  <dialog id="storyDialog">
    <form id="storyForm" class="modal-card">
      <button type="button" class="close" data-close="storyDialog">×</button>
      <h2>قصة جديدة</h2>
      <label>صورة القصة
        <input id="storyImage" type="file" accept="image/*" required />
      </label>
      <div id="storyPreview" class="story-preview" hidden></div>
      <label>نص قصير
        <input id="storyText" maxlength="120" placeholder="اختياري" />
      </label>
      <p class="hint">تختفي القصة من العرض بعد 24 ساعة.</p>
      <button id="publishStory" class="primary" type="submit">نشر القصة</button>
    </form>
  </dialog>

  <dialog id="storyViewer">
    <div class="story-viewer-card">
      <button type="button" class="close viewer-close" data-close="storyViewer">×</button>
      <div class="story-progress"><i></i></div>
      <header><img id="viewerAvatar" class="avatar" alt=""><div><strong id="viewerName"></strong><small id="viewerTime"></small></div></header>
      <img id="viewerImage" class="viewer-image" alt="القصة" />
      <p id="viewerText"></p>
      <small id="viewerViews" class="views"></small>
    </div>
  </dialog>

  <dialog id="commentsDialog">
    <div class="modal-card comments-card">
      <button type="button" class="close" data-close="commentsDialog">×</button>
      <h2>التعليقات</h2>
      <div id="commentsList" class="comments-list"></div>
      <form id="commentForm" class="comment-form">
        <input id="commentInput" maxlength="300" placeholder="أضف تعليقًا…" required />
        <button class="text-btn" type="submit">نشر</button>
      </form>
    </div>
  </dialog>

  <dialog id="noticeDialog">
    <div class="modal-card notice-card">
      <button type="button" class="close" data-close="noticeDialog">×</button>
      <h2 id="noticeTitle">تنبيه</h2><p id="noticeText"></p>
      <button class="primary" data-close="noticeDialog">حسنًا</button>
    </div>
  </dialog>

  <script type="module" src="script.js"></script>
</body>
</html>
