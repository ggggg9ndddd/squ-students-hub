</header><main class="shell"><section class="section-head" style="padding-top:55px"><div><span class="eyebrow">تجارب طلابية</span><h2>آراء الطلاب في المواد</h2><p style="color:var(--muted)">اقرأ تجارب الطلاب واكتب رأيك بأسلوب محترم ومفيد.</p></div><div class="toolbar"><label class="search">⌕<input id="opinionSearch" type="search" placeholder="ابحث باسم المادة أو رمزها أو الكلية…"></label><button id="addOpinionBtn" class="primary-btn">+ إضافة رأي</button></div></section><section id="opinionsFeed" class="grid"><p class="loading">سجّل الدخول لعرض الآراء.</p></section></main><footer class="footer"><strong>أنجز</strong><span>مساحة طلابية مستقلة لمشاركة المعرفة.</span></footer><dialog id="opinionDialog"><form id="opinionForm" class="modal">
<button type="button" class="close" data-close="opinionDialog">×</button><span class="eyebrow">رأي طالب</span><h2>أضف رأيك في مادة</h2>
<label class="field">اسم المادة<input id="opinionCourse" maxlength="80" required placeholder="مثال: اقتصاديات الموارد الطبيعية"></label>
<label class="field">رمز المادة<input id="opinionCode" maxlength="30" required placeholder="مثال: CAMS 2003"></label>
<label class="field">الكلية<select id="opinionCollege" required><option value="">اختر الكلية</option><option>كلية العلوم الزراعية والبحرية</option><option>كلية الآداب والعلوم الاجتماعية</option><option>كلية الاقتصاد والعلوم السياسية</option><option>كلية التربية</option><option>كلية الهندسة</option><option>كلية الحقوق</option><option>كلية الطب والعلوم الصحية</option><option>كلية التمريض</option><option>كلية العلوم</option></select></label>
<label class="field">رأيك أو وصفك للمادة<textarea id="opinionText" maxlength="1000" required placeholder="اكتب تجربتك، مستوى صعوبة المادة، وطريقة الاستعداد لها…"></textarea></label>
<button id="publishOpinion" class="primary-btn full" type="submit">نشر الرأي</button>
</form></dialog>
<dialog id="noticeDialog"><div class="modal notice"><button type="button" class="close" data-close="noticeDialog">×</button><h2 id="noticeTitle">تنبيه</h2><p id="noticeText"></p><button class="primary-btn full" data-close="noticeDialog">حسنًا</button></div></dialog><script type="module" src="app.js"></script></body></html>
