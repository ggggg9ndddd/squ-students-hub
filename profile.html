<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f4c45"><title>ملفي الشخصي | أنجز</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body data-page="profile"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">أ</span><strong>أنجز</strong></a><nav class="nav"><a href="index.html">الرئيسية</a><a class="active" href="profile.html">ملفي الشخصي</a></nav><div class="top-actions"><button id="themeToggle" class="icon-btn">☾</button><button id="googleLogin" class="primary-btn">تسجيل الدخول</button><div id="userMenu" class="user-chip" hidden><a href="profile.html"><img id="userPhoto" alt=""></a><div><strong id="userName"></strong><small id="userEmail"></small></div><button id="logoutButton" class="ghost-btn">خروج</button></div></div></header>
<main class="shell"><section id="loginWall" class="login-wall"><div class="brand-mark large">أ</div><h1>سجّل الدخول لعرض ملفك الشخصي</h1><p>استخدم حساب Google ثم أكمل بياناتك.</p><button id="profileLogin" class="primary-btn">تسجيل الدخول بحساب Google</button></section>
<section id="profileContent" hidden><div class="profile-layout"><aside class="profile-card"><img id="profileAvatar" class="profile-avatar" alt=""><h1 id="profileDisplayName"></h1><p id="profileDisplayEmail" class="muted"></p><div class="profile-meta"><div><small>الكلية</small><strong id="metaCollege">—</strong></div><div><small>التخصص</small><strong id="metaMajor">—</strong></div><div><small>الملفات</small><strong id="resourceCount">0</strong></div></div></aside><section class="profile-main"><form id="profileForm" class="panel"><span class="eyebrow">بيانات الحساب</span><h2>تعديل الملف الشخصي</h2><label class="field">الاسم<input id="profileName" required maxlength="80"></label><label class="field">الكلية<select id="profileCollege" required></select></label><label class="field">التخصص<input id="profileMajor" maxlength="100" placeholder="مثال: إدارة الموارد الطبيعية"></label><label class="field">نبذة قصيرة<textarea id="profileBio" maxlength="300"></textarea></label><button id="saveProfile" class="primary-btn" type="submit">حفظ التغييرات</button></form><section class="panel"><span class="eyebrow">مساهماتي</span><h2>ملفاتي المضافة</h2><div id="myResources" class="resource-grid compact"></div></section></section></div></section></main>
<footer class="footer"><strong>أنجز</strong><span>مساحة طلابية لمشاركة المعرفة.</span></footer><dialog id="noticeDialog"><div class="modal notice"><button type="button" class="close" data-close="noticeDialog">×</button><h2 id="noticeTitle">تنبيه</h2><p id="noticeText"></p><button class="primary-btn full" data-close="noticeDialog">حسنًا</button></div></dialog><script type="module" src="app.js"></script></body></html>
